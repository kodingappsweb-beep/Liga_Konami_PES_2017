<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klasemen & Riwayat Liga PES 2017</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Menyembunyikan panah default browser agar tampilan konsisten */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 font-sans">

  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 border-b border-indigo-500/30 py-6 px-4 mb-8 shadow-lg">
    <div class="max-w-6xl mx-auto flex justify-between items-center flex-wrap gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid font-bold text-yellow-400 text-3xl fa-trophy"></i>
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-wide bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">KLASEMEN PES 2017</h1>
          <p class="text-xs text-indigo-300">Sistem Poin, Statistik & Riwayat Liga</p>
        </div>
      </div>
      <div class="flex gap-2 flex-wrap">
        <button onclick="switchTab('klasemen')" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-semibold text-sm transition">Klasemen</button>
        <button onclick="switchTab('riwayat')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-4 py-2 rounded-lg font-semibold text-sm transition">Riwayat</button>
        <button onclick="switchTab('kelola')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-4 py-2 rounded-lg font-semibold text-sm transition">Kelola Tim</button>
      </div>
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-4">
    <!-- Dashboard Juara -->
    <div id="championBanner" class="hidden mb-8 bg-gradient-to-r from-yellow-600/30 via-amber-500/20 to-yellow-600/30 border border-yellow-500/50 rounded-2xl p-6 text-center backdrop-blur-sm relative overflow-hidden shadow-2xl">
      <div class="text-xs font-bold uppercase tracking-widest text-yellow-400 mb-1">👑 Juara Musim Ini 👑</div>
      <h2 id="championName" class="text-3xl md:text-5xl font-black text-yellow-300 drop-shadow mb-2"></h2>
      <p id="championPoints" class="text-slate-300 font-medium"></p>
    </div>

    <!-- Tab Klasemen Utama -->
    <div id="tabKlasemen" class="space-y-4">
      <div class="bg-slate-800/80 rounded-xl border border-slate-700/60 overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-950/80 text-slate-400 uppercase text-xs tracking-wider border-b border-slate-700">
              <tr>
                <th class="p-4 text-center">Pos</th>
                <th class="p-4">Tim</th>
                <th class="p-4 text-center">Poin</th>
                <th class="p-4 text-center">🏆 Tropi</th>
                <th class="p-4 text-center">J2</th>
                <th class="p-4 text-center">J3</th>
                <th class="p-4 text-center">Top Skor</th>
                <th class="p-4 text-center">Assist</th>
                <th class="p-4 text-center">P. Terbaik</th>
                <th class="p-4 text-center">Pelatih</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-700/50"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Tab Riwayat -->
    <div id="tabRiwayat" class="hidden space-y-6">
      <div class="flex justify-between items-center">
        <h3 class="text-xl font-bold text-slate-100">Riwayat Perubahan Klasemen</h3>
        <span class="text-xs text-slate-400">Otomatis tersimpan tiap pembaruan data</span>
      </div>
      <div id="historyContainer" class="space-y-6"></div>
    </div>

    <!-- Tab Kelola Tim & Stat -->
    <div id="tabKelola" class="hidden space-y-8">
      <div class="bg-slate-800/80 rounded-xl p-6 border border-slate-700/60">
        <h3 class="text-lg font-bold text-indigo-400 mb-4" id="formTitle">Tambah / Edit Tim</h3>
        <form id="teamForm" onsubmit="handleFormSubmit(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="hidden" id="editId" value="">
          <div>
            <label class="block text-xs font-semibold mb-1 text-slate-400">Nama Tim</label>
            <input type="text" id="inputName" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-indigo-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1 text-slate-400">URL Logo Tim</label>
            <input type="url" id="inputLogo" placeholder="https://..." required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-indigo-500 focus:outline-none">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 md:col-span-2">
            <!-- Juara 1 -->
            <div>
              <label class="block text-xs text-slate-400 mb-1">Juara 1 (+3 Poin)</label>
              <div class="flex items-center">
                <button type="button" onclick="changeValue('inputR1', -1)" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-white font-bold w-10 h-10 rounded-l-lg border border-r-0 border-slate-700 text-lg flex items-center justify-center">-</button>
                <input type="number" id="inputR1" value="0" min="0" class="w-full bg-slate-900 border border-slate-700 h-10 text-center text-sm font-bold focus:outline-none">
                <button type="button" onclick="changeValue('inputR1', 1)" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-400 text-white font-bold w-10 h-10 rounded-r-lg border border-l-0 border-indigo-600 text-lg flex items-center justify-center">+</button>
              </div>
            </div>

            <!-- Juara 2 -->
            <div>
              <label class="block text-xs text-slate-400 mb-1">Juara 2 (+2 Poin)</label>
              <div class="flex items-center">
                <button type="button" onclick="changeValue('inputR2', -1)" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-white font-bold w-10 h-10 rounded-l-lg border border-r-0 border-slate-700 text-lg flex items-center justify-center">-</button>
                <input type="number" id="inputR2" value="0" min="0" class="w-full bg-slate-900 border border-slate-700 h-10 text-center text-sm font-bold focus:outline-none">
                <button type="button" onclick="changeValue('inputR2', 1)" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-400 text-white font-bold w-10 h-10 rounded-r-lg border border-l-0 border-indigo-600 text-lg flex items-center justify-center">+</button>
              </div>
            </div>

            <!-- Juara 3 -->
            <div>
              <label class="block text-xs text-slate-400 mb-1">Juara 3 (+1 Poin)</label>
              <div class="flex items-center">
                <button type="button" onclick="changeValue('inputR3', -1)" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-white font-bold w-10 h-10 rounded-l-lg border border-r-0 border-slate-700 text-lg flex items-center justify-center">-</button>
                <input type="number" id="inputR3" value="0" min="0" class="w-full bg-slate-900 border border-slate-700 h-10 text-center text-sm font-bold focus:outline-none">
                <button type="button" onclick="changeValue('inputR3', 1)" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-400 text-white font-bold w-10 h-10 rounded-r-lg border border-l-0 border-indigo-600 text-lg flex items-center justify-center">+</button>
              </div>
            </div>

            <!-- Top Scorer -->
            <div>
              <label class="block text-xs text-slate-400 mb-1">Top Scorer</label>
              <div class="flex items-center">
                <button type="button" onclick="changeValue('inputTS', -1)" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-white font-bold w-10 h-10 rounded-l-lg border border-r-0 border-slate-700 text-lg flex items-center justify-center">-</button>
                <input type="number" id="inputTS" value="0" min="0" class="w-full bg-slate-900 border border-slate-700 h-10 text-center text-sm font-bold focus:outline-none">
                <button type="button" onclick="changeValue('inputTS', 1)" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-400 text-white font-bold w-10 h-10 rounded-r-lg border border-l-0 border-indigo-600 text-lg flex items-center justify-center">+</button>
              </div>
            </div>

            <!-- Assist -->
            <div>
              <label class="block text-xs text-slate-400 mb-1">Assist</label>
              <div class="flex items-center">
                <button type="button" onclick="changeValue('inputAST', -1)" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-white font-bold w-10 h-10 rounded-l-lg border border-r-0 border-slate-700 text-lg flex items-center justify-center">-</button>
                <input type="number" id="inputAST" value="0" min="0" class="w-full bg-slate-900 border border-slate-700 h-10 text-center text-sm font-bold focus:outline-none">
                <button type="button" onclick="changeValue('inputAST', 1)" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-400 text-white font-bold w-10 h-10 rounded-r-lg border border-l-0 border-indigo-600 text-lg flex items-center justify-center">+</button>
              </div>
            </div>

            <!-- Pemain Terbaik -->
            <div>
              <label class="block text-xs text-slate-400 mb-1">Pemain Terbaik</label>
              <div class="flex items-center">
                <button type="button" onclick="changeValue('inputBP', -1)" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-white font-bold w-10 h-10 rounded-l-lg border border-r-0 border-slate-700 text-lg flex items-center justify-center">-</button>
                <input type="number" id="inputBP" value="0" min="0" class="w-full bg-slate-900 border border-slate-700 h-10 text-center text-sm font-bold focus:outline-none">
                <button type="button" onclick="changeValue('inputBP', 1)" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-400 text-white font-bold w-10 h-10 rounded-r-lg border border-l-0 border-indigo-600 text-lg flex items-center justify-center">+</button>
              </div>
            </div>

            <!-- Pelatih Terbaik -->
            <div>
              <label class="block text-xs text-slate-400 mb-1">Pelatih Terbaik</label>
              <div class="flex items-center">
                <button type="button" onclick="changeValue('inputBC', -1)" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-white font-bold w-10 h-10 rounded-l-lg border border-r-0 border-slate-700 text-lg flex items-center justify-center">-</button>
                <input type="number" id="inputBC" value="0" min="0" class="w-full bg-slate-900 border border-slate-700 h-10 text-center text-sm font-bold focus:outline-none">
                <button type="button" onclick="changeValue('inputBC', 1)" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-400 text-white font-bold w-10 h-10 rounded-r-lg border border-l-0 border-indigo-600 text-lg flex items-center justify-center">+</button>
              </div>
            </div>
          </div>

          <div class="md:col-span-2 flex gap-2 pt-2">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2.5 rounded-lg text-sm font-semibold transition">Simpan Data & Catat Riwayat</button>
            <button type="button" onclick="resetForm()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2.5 rounded-lg text-sm transition">Batal</button>
          </div>
        </form>
      </div>

      <div class="bg-slate-800/80 rounded-xl p-6 border border-slate-700/60">
        <h3 class="text-lg font-bold text-slate-200 mb-4">Daftar Tim Terdaftar</h3>
        <div id="manageList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>
    </div>
  </div>

  <script>
    const BASE_URL = 'https://api.steinhq.com/v1/storages/6a78517e92b1163e972c59d4';
    const API_TEAMS = `${BASE_URL}/Teams`;
    const API_HISTORY = `${BASE_URL}/History`;
    
    let rawTeamsData = [];
    let historyData = [];

    // Fungsi Tambah/Kurang angka dengan tombol
    function changeValue(inputId, delta) {
      const input = document.getElementById(inputId);
      let currentValue = parseInt(input.value || 0);
      currentValue += delta;
      if (currentValue < 0) currentValue = 0;
      input.value = currentValue;
    }

    async function fetchAllData() {
      try {
        const [resTeams, resHist] = await Promise.all([
          fetch(API_TEAMS),
          fetch(API_HISTORY)
        ]);
        rawTeamsData = await resTeams.json();
        historyData = await resHist.json();
        
        renderKlasemen();
        renderManageList();
        renderHistory();
      } catch (err) {
        console.error('Gagal mengambil data:', err);
      }
    }

    function calculateAndSortTeams(teams) {
      return teams.map(t => {
        const r1 = parseInt(t.rank1 || 0);
        const r2 = parseInt(t.rank2 || 0);
        const r3 = parseInt(t.rank3 || 0);
        const points = (r1 * 3) + (r2 * 2) + (r3 * 1);
        return {
          ...t,
          points,
          r1, r2, r3,
          top_scorer: parseInt(t.top_scorer || 0),
          assist: parseInt(t.assist || 0),
          best_player: parseInt(t.best_player || 0),
          best_coach: parseInt(t.best_coach || 0)
        };
      }).sort((a, b) => {
        if (b.points !== a.points) return b.points - a.points;
        if (b.r2 !== a.r2) return b.r2 - a.r2;
        if (b.r3 !== a.r3) return b.r3 - a.r3;
        if (b.top_scorer !== a.top_scorer) return b.top_scorer - a.top_scorer;
        if (b.assist !== a.assist) return b.assist - a.assist;
        if (b.best_player !== a.best_player) return b.best_player - a.best_player;
        return b.best_coach - a.best_coach;
      });
    }

    function renderKlasemen() {
      const sorted = calculateAndSortTeams(rawTeamsData);
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      const champion = sorted.find(t => t.points >= 50);
      const banner = document.getElementById('championBanner');
      if (champion) {
        banner.classList.remove('hidden');
        document.getElementById('championName').innerText = champion.name;
        document.getElementById('championPoints').innerText = `Mencapai ${champion.points} Poin & ${champion.r1} Tropi Juara`;
      } else {
        banner.classList.add('hidden');
      }

      sorted.forEach((t, i) => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-800/50 transition">
            <td class="p-4 text-center font-bold ${i === 0 ? 'text-yellow-400' : 'text-slate-400'}">${i + 1}</td>
            <td class="p-4 font-semibold flex items-center gap-3">
              <img src="${t.logo}" class="w-8 h-8 object-contain rounded-full bg-slate-900 p-1 border border-slate-700" onerror="this.src='https://via.placeholder.com/40'">
              ${t.name}
            </td>
            <td class="p-4 text-center font-bold text-indigo-400 text-base">${t.points}</td>
            <td class="p-4 text-center font-bold text-yellow-400">${t.r1}</td>
            <td class="p-4 text-center text-slate-300">${t.r2}</td>
            <td class="p-4 text-center text-slate-300">${t.r3}</td>
            <td class="p-4 text-center text-slate-300">${t.top_scorer}</td>
            <td class="p-4 text-center text-slate-300">${t.assist}</td>
            <td class="p-4 text-center text-slate-300">${t.best_player}</td>
            <td class="p-4 text-center text-slate-300">${t.best_coach}</td>
          </tr>
        `;
      });
    }

    async function saveHistorySnapshot() {
      const sorted = calculateAndSortTeams(rawTeamsData);
      const snapshot = sorted.map((t, idx) => ({
        pos: idx + 1,
        name: t.name,
        pts: t.points,
        r1: t.r1,
        r2: t.r2,
        r3: t.r3
      }));

      const payload = {
        id: Date.now().toString(),
        timestamp: new Date().toLocaleString('id-ID'),
        data_json: JSON.stringify(snapshot)
      };

      await fetch(API_HISTORY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify([payload])
      });
    }

    function renderHistory() {
      const container = document.getElementById('historyContainer');
      container.innerHTML = '';

      if (!historyData || historyData.length === 0) {
        container.innerHTML = `<p class="text-slate-400 text-sm">Belum ada riwayat perubahannya.</p>`;
        return;
      }

      const reversed = [...historyData].reverse();

      reversed.forEach((h, index) => {
        let teamsList = [];
        try {
          teamsList = JSON.parse(h.data_json);
        } catch(e) { return; }

        let listHtml = teamsList.map(t => `
          <div class="flex justify-between items-center text-xs py-1 border-b border-slate-800">
            <span class="font-bold w-6 text-slate-400">#${t.pos}</span>
            <span class="font-semibold flex-1 text-slate-200">${t.name}</span>
            <span class="text-indigo-400 font-bold">${t.pts} Pts</span>
          </div>
        `).join('');

        container.innerHTML += `
          <div class="bg-slate-800/80 p-5 rounded-xl border border-slate-700/60 shadow-lg">
            <div class="flex justify-between items-center mb-3">
              <div>
                <span class="text-xs bg-indigo-900/60 text-indigo-300 border border-indigo-700/50 px-2.5 py-1 rounded-full font-semibold">Update #${historyData.length - index}</span>
                <span class="text-xs text-slate-400 ml-2"><i class="fa-regular fa-clock"></i> ${h.timestamp}</span>
              </div>
              <button onclick="shareToWA('${h.timestamp}', '${encodeURIComponent(h.data_json)}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1.5 transition">
                <i class="fa-brands fa-whatsapp text-sm"></i> Share WA
              </button>
            </div>
            <div class="bg-slate-900/60 p-3 rounded-lg border border-slate-800 space-y-1">
              ${listHtml}
            </div>
          </div>
        `;
      });
    }

    function shareToWA(timestamp, encodedJson) {
      const teams = JSON.parse(decodeURIComponent(encodedJson));
      
      let text = `🏆 *UPDATE KLASEMEN LIGA PES 2017* 🏆\n📅 _${timestamp}_\n\n`;
      teams.forEach(t => {
        let icon = t.pos === 1 ? '🥇' : t.pos === 2 ? '🥈' : t.pos === 3 ? '🥉' : '🔹';
        text += `${icon} *#${t.pos} ${t.name}* - ${t.pts} Pts (🏆${t.r1})\n`;
      });
      text += `\n🔥 _Pantau klasemen selengkapnya di web resmi!_`;

      const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
      window.open(waUrl, '_blank');
    }

    function renderManageList() {
      const list = document.getElementById('manageList');
      list.innerHTML = '';
      rawTeamsData.forEach(t => {
        list.innerHTML += `
          <div class="bg-slate-900 p-4 rounded-lg border border-slate-700/60 flex justify-between items-center">
            <div class="flex items-center gap-3">
              <img src="${t.logo}" class="w-10 h-10 object-contain" onerror="this.src='https://via.placeholder.com/40'">
              <div>
                <h4 class="font-bold text-slate-100">${t.name}</h4>
                <p class="text-xs text-slate-400">ID: ${t.id}</p>
              </div>
            </div>
            <div class="flex gap-2">
              <button onclick="editTeam('${t.id}')" class="bg-amber-600 hover:bg-amber-500 p-2 rounded text-xs font-semibold"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteTeam('${t.id}')" class="bg-rose-600 hover:bg-rose-500 p-2 rounded text-xs font-semibold"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      });
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('editId').value || Date.now().toString();
      const payload = {
        id,
        name: document.getElementById('inputName').value,
        logo: document.getElementById('inputLogo').value,
        rank1: document.getElementById('inputR1').value,
        rank2: document.getElementById('inputR2').value,
        rank3: document.getElementById('inputR3').value,
        top_scorer: document.getElementById('inputTS').value,
        assist: document.getElementById('inputAST').value,
        best_player: document.getElementById('inputBP').value,
        best_coach: document.getElementById('inputBC').value
      };

      if (document.getElementById('editId').value) {
        await fetch(API_TEAMS, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ condition: { id: payload.id }, set: payload })
        });
      } else {
        await fetch(API_TEAMS, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify([payload])
        });
      }

      resetForm();
      await fetchAllData();
      await saveHistorySnapshot();
      await fetchAllData();
    }

    function editTeam(id) {
      const t = rawTeamsData.find(item => item.id === id);
      if (!t) return;
      document.getElementById('editId').value = t.id;
      document.getElementById('inputName').value = t.name;
      document.getElementById('inputLogo').value = t.logo;
      document.getElementById('inputR1').value = t.rank1 || 0;
      document.getElementById('inputR2').value = t.rank2 || 0;
      document.getElementById('inputR3').value = t.rank3 || 0;
      document.getElementById('inputTS').value = t.top_scorer || 0;
      document.getElementById('inputAST').value = t.assist || 0;
      document.getElementById('inputBP').value = t.best_player || 0;
      document.getElementById('inputBC').value = t.best_coach || 0;
      document.getElementById('formTitle').innerText = 'Edit Data Tim';
    }

    async function deleteTeam(id) {
      if (!confirm('Yakin ingin menghapus tim ini?')) return;
      await fetch(API_TEAMS, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ condition: { id } })
      });
      await fetchAllData();
      await saveHistorySnapshot();
      await fetchAllData();
    }

    function resetForm() {
      document.getElementById('teamForm').reset();
      document.getElementById('editId').value = '';
      document.getElementById('formTitle').innerText = 'Tambah / Edit Tim';
    }

    function switchTab(tab) {
      document.getElementById('tabKlasemen').classList.toggle('hidden', tab !== 'klasemen');
      document.getElementById('tabRiwayat').classList.toggle('hidden', tab !== 'riwayat');
      document.getElementById('tabKelola').classList.toggle('hidden', tab !== 'kelola');
    }

    fetchAllData();
  </script>
</body>
</html>
